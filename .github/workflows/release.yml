name: Release

on:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"

permissions:
  contents: read

jobs:
  publish-npm:
    name: Publish postui to npm
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Verify package version matches tag
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          pkg_version=$(jq -r '.version' package.json)
          if [ "$pkg_version" != "$version" ]; then
            echo "tag $GITHUB_REF_NAME but package.json is $pkg_version" >&2
            exit 1
          fi
      - run: bun install --frozen-lockfile
      - run: bunx tsc --noEmit
      - run: bun test
      - run: bun publish
